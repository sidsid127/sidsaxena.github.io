<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B1B6B"/>
      <stop offset="0.55" stop-color="#3F2CB8"/>
      <stop offset="1" stop-color="#1E9C9A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E6FF"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A5B"/>
      <stop offset="1" stop-color="#FF4F7B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD66B" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFD66B" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#120A3A" flood-opacity="0.45"/>
    </filter>
  </defs><g transform="translate(512 540) scale(0.72) translate(-512 -512)">
  
  <!-- category layers -->
  <rect x="300" y="250" width="470" height="520" rx="70" fill="#FFFFFF" opacity="0.16" transform="rotate(12 535 510)"/>
  <rect x="280" y="250" width="470" height="520" rx="70" fill="#FFFFFF" opacity="0.30" transform="rotate(6 515 510)"/>
  <!-- front card -->
  <g filter="url(#shadow)">
    <rect x="254" y="250" width="470" height="520" rx="70" fill="url(#card)"/>
  </g>
  <!-- list lines -->
  <rect x="330" y="350" width="180" height="34" rx="17" fill="#CFC9F5"/>
  <rect x="330" y="640" width="250" height="34" rx="17" fill="#CFC9F5"/>
  <!-- big check -->
  <path d="M352 505 L450 600 L640 400" fill="none" stroke="url(#check)" stroke-width="74" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- priority star -->
  <circle cx="742" cy="262" r="120" fill="url(#glow)"/>
  <path transform="translate(742 262) scale(1.55)" fill="#FFD66B" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"
        d="M0,-52 L14.7,-18.6 L49.5,-16.1 L22.6,6.9 L30.6,42.1 L0,23.6 L-30.6,42.1 L-22.6,6.9 L-49.5,-16.1 L-14.7,-18.6 Z"/>

</g></svg>