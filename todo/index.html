<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Daybook</title>
  <meta name="description" content="Offline to-do list with categories, priorities and due dates. Your data stays on your phone.">
  <meta name="theme-color" content="#3F2CB8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Daybook">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="back-btn" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
    </button>
    <h1 id="title">Daybook</h1>
    <button class="icon-btn" id="menu-btn" aria-label="Menu">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </header>

  <nav class="chips" id="chips-top"></nav>
  <nav class="chips sub" id="chips-sub"></nav>

  <main>
    <p class="summary" id="summary"></p>
    <ul class="list" id="list"></ul>
    <p class="empty" id="empty" hidden></p>
  </main>

  <form class="addbar" id="addbar" autocomplete="off">
    <button type="button" class="icon-btn due-btn" id="due-btn" aria-label="Set due date">
      <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"/></svg>
      <span class="dot" id="due-dot" hidden></span>
    </button>
    <input id="input" type="text" enterkeyhint="done" autocapitalize="sentences" placeholder="Add a task…">
    <button type="submit" class="add-btn" id="add-btn">Add</button>
  </form>

  <div class="lock" id="lock" hidden>
    <img src="icons/icon-192.png" alt="" class="lock-logo">
    <h2>Locked</h2>
    <div class="pin-dots" id="pin-dots"></div>
    <p class="lock-msg" id="lock-msg">Enter your PIN</p>
    <div class="keypad" id="keypad"></div>
    <button class="faceid-btn" id="faceid-btn" hidden>Unlock with Face ID</button>
  </div>

  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden></section>
  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
